<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030B5B">
  <title>Welcome</title>

  <!-- Warm up the homepage while the intro plays so it appears instantly -->
  <link rel="prefetch" href="index.html">

  <link rel="stylesheet" href="intro.css">

  <!-- If JavaScript is disabled, go straight to the homepage -->
  <noscript><meta http-equiv="refresh" content="0;url=index.html"></noscript>

  <!-- Runs first so returning visitors are sent to the homepage before anything paints -->
  <script src="intro.js"></script>
</head>
<body>

  <main class="intro" id="intro">

    <!-- Atmosphere: soft light on the navy field -->
    <div class="bg" aria-hidden="true"></div>

    <!-- Transition: a crimson rim and a white wash grow out of the image frame -->
    <div class="wash wash--rim" aria-hidden="true"></div>
    <div class="wash" aria-hidden="true"></div>

    <!-- Two quick white light passes -->
    <div class="streaks" aria-hidden="true">
      <i class="streak streak--1"></i>
      <i class="streak streak--2"></i>
    </div>

    <!-- Flowing crimson light trails -->
    <svg class="trails" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="trailGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0">
          <stop offset="0"   stop-color="#C1272D" stop-opacity="0"/>
          <stop offset="0.45" stop-color="#C1272D" stop-opacity="1"/>
          <stop offset="1"   stop-color="#C1272D" stop-opacity="0.15"/>
        </linearGradient>
      </defs>

      <!-- Trail A (hero trail: halo + body + core) -->
      <path class="trail trail--a" pathLength="1" stroke="url(#trailGrad)" stroke-width="14" opacity=".14"
            d="M-120 760 C 260 820, 520 330, 900 430 S 1480 140, 1720 210"/>
      <path class="trail trail--a" pathLength="1" stroke="url(#trailGrad)" stroke-width="4" opacity=".4"
            d="M-120 760 C 260 820, 520 330, 900 430 S 1480 140, 1720 210"/>
      <path class="trail trail--a" pathLength="1" stroke="url(#trailGrad)" stroke-width="1.6"
            d="M-120 760 C 260 820, 520 330, 900 430 S 1480 140, 1720 210"/>

      <!-- Trail B -->
      <path class="trail trail--b" pathLength="1" stroke="url(#trailGrad)" stroke-width="3.5" opacity=".3"
            d="M-120 190 C 280 90, 600 560, 1000 500 S 1420 820, 1720 720"/>
      <path class="trail trail--b" pathLength="1" stroke="url(#trailGrad)" stroke-width="1.2" opacity=".9"
            d="M-120 190 C 280 90, 600 560, 1000 500 S 1420 820, 1720 720"/>

      <!-- Trail C (white on navy, turns navy on white) -->
      <path class="trail trail--c" pathLength="1" stroke="currentColor" stroke-width="1" opacity=".35"
            d="M-120 470 C 380 360, 720 690, 1100 575 S 1500 420, 1720 480"/>
    </svg>

    <!-- Subtle glowing particles (fixed positions, no random movement) -->
    <div class="particles" aria-hidden="true">
      <i class="p p--r" style="--x:8%;  --y:18%; --s:4px; --d:.0s"></i>
      <i class="p p--w" style="--x:14%; --y:62%; --s:3px; --d:.4s"></i>
      <i class="p p--w" style="--x:20%; --y:36%; --s:5px; --d:1.1s"></i>
      <i class="p p--r" style="--x:27%; --y:82%; --s:4px; --d:.7s"></i>
      <i class="p p--w" style="--x:33%; --y:12%; --s:3px; --d:1.6s"></i>
      <i class="p p--r" style="--x:41%; --y:90%; --s:5px; --d:.2s"></i>
      <i class="p p--w" style="--x:48%; --y:6%;  --s:4px; --d:1.3s"></i>
      <i class="p p--w" style="--x:55%; --y:94%; --s:3px; --d:.9s"></i>
      <i class="p p--r" style="--x:63%; --y:10%; --s:5px; --d:.5s"></i>
      <i class="p p--w" style="--x:70%; --y:86%; --s:4px; --d:1.8s"></i>
      <i class="p p--r" style="--x:76%; --y:28%; --s:3px; --d:1.0s"></i>
      <i class="p p--w" style="--x:82%; --y:70%; --s:5px; --d:.3s"></i>
      <i class="p p--r" style="--x:88%; --y:14%; --s:4px; --d:1.5s"></i>
      <i class="p p--w" style="--x:91%; --y:52%; --s:3px; --d:.8s"></i>
      <i class="p p--r" style="--x:6%;  --y:88%; --s:3px; --d:1.9s"></i>
      <i class="p p--w" style="--x:95%; --y:84%; --s:4px; --d:.6s"></i>
    </div>

    <!-- ============ MAIN VISUAL: your image lives here ============ -->
    <div class="stage">

      <!-- Geometric shapes behind the image -->
      <svg class="geo" viewBox="0 0 600 600" aria-hidden="true" focusable="false">
        <circle class="geo__ring" cx="300" cy="300" r="296" fill="none" stroke="currentColor" stroke-width="1"/>

        <g class="geo__spin geo__spin--diamond">
          <rect class="geo__diamond" x="109" y="109" width="382" height="382" transform="rotate(45 300 300)"
                pathLength="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="295" y="25"  width="10" height="10" fill="#C1272D"/>
          <rect x="565" y="295" width="10" height="10" fill="#C1272D"/>
          <rect x="295" y="565" width="10" height="10" fill="#C1272D"/>
          <rect x="25"  y="295" width="10" height="10" fill="#C1272D"/>
        </g>

        <g class="geo__spin geo__spin--orbit">
          <circle cx="300" cy="300" r="288" fill="none" stroke="#C1272D" stroke-width="9" stroke-opacity=".18"
                  pathLength="100" stroke-dasharray="26 74" stroke-linecap="round"/>
          <circle cx="300" cy="300" r="288" fill="none" stroke="#C1272D" stroke-width="2.5"
                  pathLength="100" stroke-dasharray="26 74" stroke-linecap="round"/>
        </g>
      </svg>

      <div class="frame">
        <div class="frame__inner">

          <!--
            ┌──────────────────────────────────────────────────────────┐
            │  CHANGE YOUR IMAGE HERE — edit only the src path below.  │
            └──────────────────────────────────────────────────────────┘
          -->
          <img id="introImage"
               class="frame__img"
               src="images/my-custom-image.png"
               alt="Brand visual"
               decoding="async"
               fetchpriority="high"
               draggable="false">

          <!-- Only shown if the image path above is wrong -->
          <p class="frame__empty" id="introEmpty">Your image goes here</p>
        </div>
      </div>
    </div>

    <!-- Brand name and tagline (edit the text freely, or delete this block) -->
    <div class="brand">
      <h1 class="brand__name"><span>Your Brand</span></h1>
      <span class="brand__rule" aria-hidden="true"></span>
      <p class="brand__tag">Your tagline goes here</p>
    </div>

    <a class="skip" id="skipIntro" href="index.html">Skip intro</a>

    <!-- White curtain used only when the visitor skips -->
    <div class="curtain" aria-hidden="true"></div>
  </main>

</body>
</html>
